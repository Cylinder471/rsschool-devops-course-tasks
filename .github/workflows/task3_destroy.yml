name: Terraform Destroy
on:
  workflow_dispatch:

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    environment: production   # требует настроенного environment с required reviewers
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACC_ID }}:role/GithubActionsRole
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_aws_region: us-east-1

      - name: Terraform Plan Destroy (preview)
        run: terraform plan -destroy -out=destroy.plan
        env:
          TF_VAR_aws_region: us-east-1

      - name: Terraform Apply Destroy (execute)
        run: terraform apply -auto-approve "destroy.plan"
        env:
          TF_VAR_aws_region: us-east-1