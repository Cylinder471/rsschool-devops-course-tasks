name: 'k3s'

on:
  push:
    branches:
      - task_3

permissions:
  id-token: write
  contents: read

env:
  AWS_ACC_ID: ${{ secrets.AWS_ACC_ID }}

jobs:
  terraform-check:
    name: 'Terraform check'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Cache Terraform Directory
      uses: actions/cache@v3
      with:
        path: Task2
        key: ${{ runner.os }}-k3s-${{ hashFiles('task-2/vpc/**') }}
        restore-keys: |
          ${{ runner.os }}-k3s-

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACC_ID }}:role/GithubActionsRole
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init
      working-directory: Task3

    - name: Terraform Format
      run: terraform fmt
      working-directory: Task3


  terraform-plan:
    name: 'Terraform plan'
    runs-on: ubuntu-latest
    needs: terraform-check

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3


    - name: Cache Terraform Directory
      uses: actions/cache@v3
      with:
        path: Task3
        key: ${{ runner.os }}-k3s-${{ hashFiles('task-3/k3s/**') }}
        restore-keys: |
          ${{ runner.os }}-k3s-

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACC_ID }}:role/GithubActionsRole
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init
      working-directory: Task3

    - name: Terraform Planning
      run: terraform plan -input=false
      working-directory: Task3


  terraform-apply:
    
    name: 'Terraform apply'
    runs-on: ubuntu-latest
    needs: terraform-plan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Cache Terraform Directory
      uses: actions/cache@v3
      with:
        path: Task2
        key: ${{ runner.os }}-k3s-${{ hashFiles('Task3/**') }}
        restore-keys: |
          ${{ runner.os }}-k3s-

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACC_ID }}:role/GithubActionsRole
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init
      working-directory: Task3
      
    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false
      working-directory: Task3
